# foremost 1.5.7 配置文件（ImageStrike 自带）
#
# 原仓库只带了 foremost.exe 却没带 foremost.conf，程序默认去
# "C:\Program Files\foremost\foremost.conf" 找配置，找不到就直接退出，
# 因此这条功能实际上一直不可用。这里补一份常用类型的配置，
# 并在调用时通过 -c 指定（见 strike/stegtools.py）。
#
# 字段：名称  后缀(y/n 是否区分大小写)  最大长度  文件头  文件尾
# 十六进制字节用 \xNN 表示。
#
# ---------------------------------------------------------------- 图片
jpg    y    20000000   \xff\xd8\xff          \xff\xd9
png    y    20000000   \x89PNG               IEND
gif    y    20000000   \x47\x49\x46\x38\x37\x61   \x00\x3b
gif    y    20000000   \x47\x49\x46\x38\x39\x61   \x00\x3b
bmp    y    20000000   BM                    \x00\x00
tif    y    20000000   \x4d\x4d\x00\x2a       \x00\x00
tif    y    20000000   \x49\x49\x2a\x00       \x00\x00
webp   y    20000000   RIFF                  \x00\x00
psd    y    20000000   \x38\x42\x50\x53       \x00\x00

# ---------------------------------------------------------------- 压缩包
zip    y    50000000   PK\x03\x04             PK\x05\x06
rar    y    50000000   Rar!                   \x00\x00
7z     y    50000000   \x37\x7a\xbc\xaf\x27\x1c  \x00\x00
gz     y    50000000   \x1f\x8b\x08            \x00\x00
tar    y    50000000   \x75\x73\x74\x61\x72    \x00\x00

# ---------------------------------------------------------------- 文档
pdf    y    50000000   %PDF-                  %%EOF
ole    y    50000000   \xd0\xcf\x11\xe0\xa1\xb1\x1a\xe1   \x00\x00
rtf    y    50000000   {\rtf                  \x00\x00
html   y    50000000   <html                  </html>
xml    y    50000000   <?xml                  </xml>

# ---------------------------------------------------------------- 音视频
wav    y    50000000   WAVE                   \x00\x00
avi    y    50000000   AVI                    \x00\x00
mp4    y    50000000   ftyp                   \x00\x00
mov    y    50000000   \x00\x00\x00\x14ftyp    \x00\x00
mpg    y    50000000   \x00\x00\x01\xba         \x00\x00\x01\xb9
flv    y    50000000   FLV\x01                 \x00\x00

# ---------------------------------------------------------------- 其他
exe    y    10000000   MZ                     \x00\x00
elf    y    10000000   \x7fELF                \x00\x00
sqlite y    50000000   SQLite format 3        \x00\x00
